<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>市川学園 なずな祭</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700;900&family=Noto+Sans+JP:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#1B1F3B;
  --bg-soft:#232849;
  --surface:#262C52;
  --surface-2:#2E3560;
  --text:#F5F3EE;
  --muted:#AEB4D9;
  --pink:#F3B6C6;
  --pink-deep:#E893AC;
  --gold:#F2C572;
  --mint:#7FE0CB;
  --line:rgba(255,255,255,0.14);
  --shadow:0 18px 40px rgba(8,10,30,0.45);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:
    radial-gradient(ellipse 900px 500px at 15% -5%, rgba(243,182,198,0.10), transparent 60%),
    radial-gradient(ellipse 700px 500px at 90% 10%, rgba(127,224,203,0.09), transparent 55%),
    var(--bg);
  color:var(--text);
  font-family:"Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
  font-weight:400;
  line-height:1.8;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
h1,h2,h3,.brand{font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN",sans-serif;}
a{color:inherit;}
img{max-width:100%;display:block;}
.wrap{max-width:1040px;margin:0 auto;padding:0 20px;}

.stars{position:fixed;inset:0;pointer-events:none;z-index:0;opacity:0.55;}

header.site{
  position:sticky;top:0;z-index:40;
  background:rgba(27,31,59,0.82);
  backdrop-filter:blur(14px) saturate(140%);
  -webkit-backdrop-filter:blur(14px) saturate(140%);
  border-bottom:1px solid var(--line);
}
.header-top{display:flex;justify-content:center;padding:12px 20px 4px;}
.brand{
  display:flex;align-items:baseline;gap:10px;
  font-size:1.15rem;font-weight:700;letter-spacing:0.02em;white-space:nowrap;
}
.brand small{font-family:"Noto Sans JP",sans-serif;font-size:0.68rem;font-weight:500;color:var(--muted);letter-spacing:0.08em;}
.brand .accent{background:linear-gradient(90deg,var(--pink),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent;}
.header-tabs{display:flex;justify-content:center;padding:2px 20px 10px;border-top:1px solid transparent;}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;max-width:100%;}
nav.tabs::-webkit-scrollbar{display:none;}
nav.tabs button{
  font-family:"Zen Maru Gothic",sans-serif;background:none;border:none;color:var(--muted);
  font-size:0.92rem;font-weight:700;padding:8px 14px;border-radius:999px;cursor:pointer;
  white-space:nowrap;transition:color .2s, background .2s;
}
nav.tabs button:hover{color:var(--text);}
nav.tabs button.active{color:var(--bg);background:linear-gradient(90deg,var(--pink),var(--gold));}

main{position:relative;z-index:1;}
.page{display:none;padding:36px 0 90px;animation:fadeIn .5s ease;}
.page.active{display:block;}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
@media (prefers-reduced-motion: reduce){.page{animation:none;}}

.eyebrow-icon{display:inline-flex;align-items:center;gap:8px;color:var(--gold);font-size:0.85rem;font-weight:600;margin-bottom:6px;}
.eyebrow-icon svg{width:16px;height:16px;}
h2.section-title{font-size:1.7rem;font-weight:700;margin:0 0 6px;}
.section-lede{color:var(--muted);margin:0 0 28px;max-width:60ch;font-size:0.97rem;}

.hero{display:grid;grid-template-columns:1.05fr 0.95fr;gap:36px;align-items:center;padding-top:6px;}
@media (max-width:820px){.hero{grid-template-columns:1fr;}}
.hero-copy .kicker{display:inline-block;padding:5px 14px;border-radius:999px;border:1px solid var(--line);color:var(--gold);font-size:0.78rem;font-weight:600;letter-spacing:0.04em;margin-bottom:16px;background:rgba(242,197,114,0.08);}
.hero-copy h1{font-size:clamp(1.9rem,4.6vw,3rem);line-height:1.28;font-weight:900;margin:0 0 10px;}
.hero-copy .sub{font-family:"Zen Maru Gothic",sans-serif;font-weight:700;font-size:1.15rem;color:var(--pink);margin:0 0 18px;}
.hero-copy p.lede{color:var(--muted);font-size:0.98rem;max-width:46ch;margin:0 0 24px;white-space:pre-wrap;}
.date-pills{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:22px;align-items:flex-start;}
.date-pill{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px 16px;box-shadow:var(--shadow);}
.date-pill .day{font-size:0.72rem;color:var(--muted);}
.date-pill .date{font-family:"Zen Maru Gothic",sans-serif;font-weight:700;font-size:1.05rem;}
.date-pill .time{font-size:0.82rem;color:var(--mint);font-weight:600;}
.date-pill.ed-block{display:flex;flex-direction:column;gap:4px;min-width:170px;}

.poster-frame{position:relative;border-radius:22px;overflow:hidden;border:1px solid var(--line);box-shadow:var(--shadow);background:var(--surface);}
.poster-frame img{width:100%;height:auto;}

.info-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:44px;}
@media (max-width:720px){.info-cards{grid-template-columns:1fr;}}
.info-card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:var(--shadow);}
.info-card .ic-icon{width:30px;height:30px;color:var(--mint);margin-bottom:10px;}
.info-card h3{margin:0 0 6px;font-size:1rem;font-weight:700;}
.info-card p{margin:0;color:var(--muted);font-size:0.9rem;white-space:pre-wrap;}
.info-card a{color:var(--gold);text-decoration:underline;text-underline-offset:3px;}

.subtabs{display:flex;gap:8px;margin-bottom:26px;flex-wrap:wrap;}
.subtabs button{font-family:"Zen Maru Gothic",sans-serif;font-weight:700;font-size:0.9rem;background:var(--surface);border:1px solid var(--line);color:var(--muted);padding:9px 18px;border-radius:999px;cursor:pointer;transition:.2s;}
.subtabs button.active{color:var(--bg);background:linear-gradient(90deg,var(--mint),var(--pink));border-color:transparent;}

.card-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;}
@media (max-width:900px){.card-grid{grid-template-columns:repeat(2,1fr);}}
@media (max-width:600px){.card-grid{grid-template-columns:1fr;}}
.subpage{display:none;}
.subpage.active{display:block;}

.ex-card{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column;}
.img-slot{aspect-ratio:4/3;width:100%;background:repeating-linear-gradient(135deg, rgba(255,255,255,0.035) 0 10px, transparent 10px 20px), var(--bg-soft);border-bottom:1px dashed var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--muted);text-align:center;padding:14px;position:relative;}
.img-slot svg{width:28px;height:28px;color:var(--gold);opacity:0.8;}
.img-slot span{font-size:0.76rem;line-height:1.5;}
.img-slot.has-img{padding:0;}
.img-slot.has-img img{width:100%;height:100%;object-fit:cover;}
.img-slot.editable{cursor:pointer;}
.img-slot.editable:hover{border-color:var(--mint);}
.img-edit-overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(20,20,35,0.55);color:#fff;font-size:0.78rem;opacity:0;transition:.2s;text-align:center;padding:10px;}
.img-slot.editable:hover .img-edit-overlay{opacity:1;}
.ex-card .body{padding:16px 18px 20px;position:relative;}
.ex-card .tag{display:inline-block;font-size:0.7rem;font-weight:700;color:var(--mint);border:1px solid var(--mint);border-radius:999px;padding:2px 10px;margin-bottom:8px;}
.ex-card h3{margin:0 0 4px;font-size:1.02rem;font-weight:700;}
.ex-card .group{color:var(--pink);font-size:0.83rem;font-weight:600;margin-bottom:8px;}
.ex-card p{margin:0 0 8px;color:var(--muted);font-size:0.87rem;white-space:pre-wrap;}
.ex-card .loc{font-size:0.78rem;color:var(--muted);display:flex;align-items:center;gap:5px;}
.ex-card .loc svg{width:13px;height:13px;color:var(--gold);}
.ex-card .ed-remove-card{position:absolute;top:10px;right:10px;}
.add-card-tile{border:1px dashed var(--line);border-radius:18px;display:flex;align-items:center;justify-content:center;min-height:200px;color:var(--muted);cursor:pointer;font-weight:700;background:transparent;font-family:"Zen Maru Gothic",sans-serif;font-size:0.95rem;}
.add-card-tile:hover{color:var(--mint);border-color:var(--mint);}

.tt-image{margin-bottom:30px;}
.tt-image .img-slot{aspect-ratio:16/7;border-radius:18px;border:1px dashed var(--line);}
.day-tabs{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap;align-items:center;}
.day-tabs button.day-btn{font-family:"Zen Maru Gothic",sans-serif;font-weight:700;background:var(--surface);border:1px solid var(--line);color:var(--muted);padding:8px 16px;border-radius:12px;cursor:pointer;}
.day-tabs button.day-btn.active{background:var(--gold);color:#2a2210;border-color:transparent;}
table.tt{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--shadow);}
table.tt th, table.tt td{text-align:left;padding:12px 16px;border-bottom:1px solid var(--line);font-size:0.9rem;}
table.tt th{color:var(--muted);font-weight:600;font-size:0.78rem;letter-spacing:0.04em;}
table.tt tr:last-child td{border-bottom:none;}
table.tt td.time{color:var(--mint);font-weight:700;white-space:nowrap;font-family:"Zen Maru Gothic",sans-serif;}
.ed-day-label{font-family:"Zen Maru Gothic",sans-serif;font-weight:700;background:var(--bg-soft);border:1px dashed var(--line);border-radius:10px;padding:8px 12px;color:var(--text);font-size:0.9rem;}

.route-grid{display:grid;grid-template-columns:1.15fr 0.85fr;gap:28px;align-items:start;}
@media (max-width:880px){.route-grid{grid-template-columns:1fr;}}
.map-slot{aspect-ratio:4/3;border-radius:20px;border:1px dashed var(--line);}
.access-card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:var(--shadow);}
.access-card h3{margin:0 0 14px;font-size:1.02rem;display:flex;align-items:center;gap:8px;}
.access-card h3 svg{width:18px;height:18px;color:var(--mint);}
.access-list{list-style:none;margin:0 0 18px;padding:0;}
.access-list li{padding:9px 0;border-bottom:1px solid var(--line);font-size:0.88rem;display:flex;justify-content:space-between;gap:10px;color:var(--text);align-items:center;}
.access-list li:last-child{border-bottom:none;}
.access-list li .place{font-weight:600;}
.access-list li .mins{color:var(--muted);white-space:nowrap;}
.note-box{background:var(--bg-soft);border-radius:12px;padding:14px 16px;font-size:0.82rem;color:var(--muted);border:1px solid var(--line);white-space:pre-wrap;}

.news-list{display:flex;flex-direction:column;gap:2px;}
.news-item{display:flex;gap:18px;padding:18px 0;border-bottom:1px solid var(--line);position:relative;}
.news-item:last-child{border-bottom:none;}
.news-item .nd{font-family:"Zen Maru Gothic",sans-serif;font-weight:700;color:var(--gold);font-size:0.82rem;white-space:nowrap;padding-top:2px;min-width:76px;}
.news-item .nb h3{margin:0 0 4px;font-size:0.98rem;font-weight:700;}
.news-item .nb p{margin:0;color:var(--muted);font-size:0.88rem;white-space:pre-wrap;}
.badge{display:inline-block;font-size:0.68rem;font-weight:700;padding:1px 9px;border-radius:999px;margin-left:8px;vertical-align:middle;}
.badge.new{background:rgba(127,224,203,0.16);color:var(--mint);}
.badge.update{background:rgba(243,182,198,0.16);color:var(--pink);}

footer{border-top:1px solid var(--line);padding:34px 0;position:relative;z-index:1;}
.footer-inner{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:14px;font-size:0.82rem;color:var(--muted);}
.footer-inner a{color:var(--gold);text-decoration:none;}
.footer-inner a:hover{text-decoration:underline;}

/* ---- editing UI ---- */
input.ed-input, textarea.ed-input{
  width:100%;background:var(--bg-soft);border:1px dashed var(--line);border-radius:10px;
  color:var(--text);padding:8px 10px;font-family:inherit;font-size:0.88rem;margin:3px 0;
}
input.ed-input:focus, textarea.ed-input:focus{outline:none;border-color:var(--mint);}
textarea.ed-input{resize:vertical;min-height:56px;}
.ed-row{display:flex;gap:8px;align-items:center;margin:6px 0;}
.ed-row .ed-input{margin:0;}
.ed-remove{background:none;border:1px solid var(--line);color:var(--pink);border-radius:8px;width:30px;height:30px;flex:0 0 auto;cursor:pointer;font-size:0.9rem;line-height:1;}
.ed-remove:hover{background:rgba(243,182,198,0.12);}
.ed-add{background:var(--surface);border:1px dashed var(--line);color:var(--mint);border-radius:10px;padding:8px 14px;cursor:pointer;font-weight:700;font-size:0.85rem;margin-top:6px;font-family:"Zen Maru Gothic",sans-serif;}
.ed-add:hover{border-color:var(--mint);}
.edit-note{display:inline-flex;align-items:center;gap:6px;font-size:0.78rem;color:var(--mint);background:rgba(127,224,203,0.1);border:1px solid rgba(127,224,203,0.3);border-radius:999px;padding:5px 12px;margin-bottom:20px;}

.edit-fab{position:fixed;right:18px;bottom:18px;z-index:60;display:flex;gap:10px;}
.edit-fab button{font-family:"Zen Maru Gothic",sans-serif;font-weight:700;border:none;border-radius:999px;padding:12px 20px;cursor:pointer;box-shadow:var(--shadow);font-size:0.88rem;}
.btn-edit{background:linear-gradient(90deg,var(--pink),var(--gold));color:#241F2E;}
.btn-save{background:var(--mint);color:#0d2620;}
.btn-cancel{background:var(--surface);color:var(--muted);border:1px solid var(--line) !important;}
.hidden{display:none !important;}

.toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);background:var(--surface);border:1px solid var(--line);color:var(--text);padding:10px 18px;border-radius:999px;box-shadow:var(--shadow);font-size:0.85rem;z-index:70;opacity:0;pointer-events:none;transition:opacity .3s;white-space:nowrap;}
.toast.show{opacity:1;}

::selection{background:var(--pink);color:#241F2E;}
</style>
</head>

<script>
(function(){
  "use strict";
  var ORIGINAL_HTML = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;
  var state = JSON.parse(document.getElementById('site-data').textContent);
  var editMode = false;
  var snapshot = null;
  var artifactApi = null;
  var ttActiveDay = 0;
  var exActiveTab = 'class';

  function esc(s){
    s = (s===undefined || s===null) ? '' : String(s);
    return s.replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  function blankExhibit(){ return {tag:'', title:'新しい展示', group:'', desc:'', loc:'', img:''}; }
  function blankRow(){ return {time:'', event:'', place:''}; }
  function blankAccess(){ return {place:'', mins:''}; }
  function blankNews(){ return {date:'', title:'新しいお知らせ', desc:'', badge:''}; }

  function imgSlotHtml(path, value, label, extraClass){
    var inner;
    var cls = 'img-slot' + (extraClass ? ' ' + extraClass : '');
    if(value){ cls += ' has-img'; }
    if(editMode){
      cls += ' editable';
      inner = value ? '<img src="'+esc(value)+'" alt="">' : (
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="4" width="18" height="15" rx="2"/><path d="M3 15l5-5 4 4 4-4 5 5"/><circle cx="8" cy="9" r="1.5"/></svg><span>'+esc(label)+'</span>'
      );
      inner += '<div class="img-edit-overlay">タップして画像を選択</div>';
      return '<div class="'+cls+'" data-action="uploadImg" data-path="'+esc(path)+'">'+inner+'</div>';
    }
    if(value){
      inner = '<img src="'+esc(value)+'" alt="">';
    } else {
      inner = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="4" width="18" height="15" rx="2"/><path d="M3 15l5-5 4 4 4-4 5 5"/><circle cx="8" cy="9" r="1.5"/></svg><span>'+esc(label)+'</span>';
    }
    return '<div class="'+cls+'">'+inner+'</div>';
  }

  function renderHome(){
    var h = state.home;
    var datesHtml = h.dates.map(function(d,i){
      if(editMode){
        return '<div class="date-pill ed-block">'+
          '<input class="ed-input" data-path="home.dates.'+i+'.day" value="'+esc(d.day)+'" placeholder="例: 1日目・土曜日">'+
          '<input class="ed-input" data-path="home.dates.'+i+'.date" value="'+esc(d.date)+'" placeholder="例: 9月20日">'+
          '<input class="ed-input" data-path="home.dates.'+i+'.time" value="'+esc(d.time)+'" placeholder="例: 9:00〜16:00">'+
          '<button class="ed-remove" data-action="removeDate" data-index="'+i+'" title="削除">×</button>'+
          '</div>';
      }
      return '<div class="date-pill"><div class="day">'+esc(d.day)+'</div><div class="date">'+esc(d.date)+'</div><div class="time">'+esc(d.time)+'</div></div>';
    }).join('');
    if(editMode){ datesHtml += '<button class="ed-add" data-action="addDate">＋ 日程を追加</button>'; }

    var titleHtml, subHtml, kickerHtml, ledeHtml;
    if(editMode){
      kickerHtml = '<input class="ed-input" data-path="home.kicker" value="'+esc(h.kicker)+'">';
      titleHtml = '<input class="ed-input" data-path="home.titleLine1" value="'+esc(h.titleLine1)+'" style="font-size:1.3rem;font-weight:700;">'+
                  '<input class="ed-input" data-path="home.titleLine2" value="'+esc(h.titleLine2)+'" style="font-size:1.3rem;font-weight:700;">';
      subHtml = '<input class="ed-input" data-path="home.sub" value="'+esc(h.sub)+'">';
      ledeHtml = '<textarea class="ed-input" data-path="home.lede">'+esc(h.lede)+'</textarea>';
    } else {
      kickerHtml = '<span class="kicker">'+esc(h.kicker)+'</span>';
      titleHtml = '<h1>'+esc(h.titleLine1)+'<br>'+esc(h.titleLine2)+'</h1>';
      subHtml = '<p class="sub">'+esc(h.sub)+'</p>';
      ledeHtml = '<p class="lede">'+esc(h.lede)+'</p>';
    }

    var themeHtml, venueHtml, contactHtml;
    if(editMode){
      themeHtml = '<textarea class="ed-input" data-path="home.theme">'+esc(h.theme)+'</textarea>';
      venueHtml = '<textarea class="ed-input" data-path="home.venue">'+esc(h.venue)+'</textarea>';
      contactHtml = '<input class="ed-input" data-path="home.contactSite" value="'+esc(h.contactSite)+'" placeholder="学校サイトURL">'+
                     '<input class="ed-input" data-path="home.contactInsta" value="'+esc(h.contactInsta)+'" placeholder="Instagram">';
    } else {
      themeHtml = '<p>'+esc(h.theme)+'</p>';
      venueHtml = '<p>'+esc(h.venue)+'</p>';
      contactHtml = '<p>学校ホームページ：<a href="'+esc(h.contactSite)+'" target="_blank" rel="noopener">'+esc(h.contactSite.replace(/^https?:\/\//,''))+'</a><br>Instagram：'+esc(h.contactInsta)+'</p>';
    }

    var html = ''
      + (editMode ? '<div class="edit-note">✏️ 編集モード：項目をタップして書き換えられます</div>' : '')
      + '<div class="hero">'
      +   '<div class="hero-copy">'
      +     kickerHtml + titleHtml + subHtml + ledeHtml
      +     '<div class="date-pills">'+datesHtml+'</div>'
      +   '</div>'
      +   '<div class="poster-frame">' + imgSlotHtml('home.posterSrc', h.posterSrc, 'ポスター画像未設定') + '</div>'
      + '</div>'
      + '<div class="info-cards">'
      +   '<div class="info-card"><svg class="ic-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 3v4M4 21c0-4 4-6 8-6s8 2 8 6"/><circle cx="12" cy="9" r="4"/></svg><h3>テーマ</h3>'+themeHtml+'</div>'
      +   '<div class="info-card"><svg class="ic-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg><h3>会場</h3>'+venueHtml+'</div>'
      +   '<div class="info-card"><svg class="ic-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 9h18"/></svg><h3>お問い合わせ</h3>'+contactHtml+'</div>'
      + '</div>';
    document.getElementById('home-content').innerHTML = html;
  }

  function exhibitCardHtml(item, i, listKey){
    if(editMode){
      return '<div class="ex-card">'
        + imgSlotHtml('exhibits.'+listKey+'.'+i+'.img', item.img, '画像未設定')
        + '<div class="body">'
        +   '<button class="ed-remove ed-remove-card" data-action="removeExhibit" data-list="'+listKey+'" data-index="'+i+'" title="この展示を削除">×</button>'
        +   '<input class="ed-input" data-path="exhibits.'+listKey+'.'+i+'.tag" value="'+esc(item.tag)+'" placeholder="タグ (例: クラス展示)">'
        +   '<input class="ed-input" data-path="exhibits.'+listKey+'.'+i+'.title" value="'+esc(item.title)+'" placeholder="展示名">'
        +   '<input class="ed-input" data-path="exhibits.'+listKey+'.'+i+'.group" value="'+esc(item.group)+'" placeholder="クラス・団体名">'
        +   '<textarea class="ed-input" data-path="exhibits.'+listKey+'.'+i+'.desc" placeholder="紹介文">'+esc(item.desc)+'</textarea>'
        +   '<input class="ed-input" data-path="exhibits.'+listKey+'.'+i+'.loc" value="'+esc(item.loc)+'" placeholder="場所">'
        + '</div></div>';
    }
    return '<div class="ex-card">'
      + imgSlotHtml('', item.img, '画像未設定')
      + '<div class="body">'
      +   (item.tag ? '<span class="tag">'+esc(item.tag)+'</span>' : '')
      +   '<h3>'+esc(item.title)+'</h3>'
      +   (item.group ? '<div class="group">'+esc(item.group)+'</div>' : '')
      +   (item.desc ? '<p>'+esc(item.desc)+'</p>' : '')
      +   (item.loc ? '<div class="loc"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg>'+esc(item.loc)+'</div>' : '')
      + '</div></div>';
  }

  function renderExhibits(){
    var classHtml = state.exhibits.class.map(function(it,i){ return exhibitCardHtml(it,i,'class'); }).join('');
    var clubHtml = state.exhibits.club.map(function(it,i){ return exhibitCardHtml(it,i,'club'); }).join('');
    if(editMode){
      classHtml += '<button class="add-card-tile" data-action="addExhibit" data-list="class">＋ クラス展示を追加</button>';
      clubHtml += '<button class="add-card-tile" data-action="addExhibit" data-list="club">＋ 部活・有志展示を追加</button>';
    }
    var html = ''
      + '<div class="eyebrow-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 20V10l8-6 8 6v10"/><path d="M9 20v-6h6v6"/></svg>展示</div>'
      + '<h2 class="section-title">クラス展示・部活/有志展示</h2>'
      + '<p class="section-lede">タブを切り替えて、クラス展示と部活・有志展示をチェックできます。</p>'
      + (editMode ? '<div class="edit-note">✏️ 編集モード：カード内をタップして書き換え、画像をタップして差し替えられます</div>' : '')
      + '<div class="subtabs" id="exTabs">'
      +   '<button data-sub="class" class="'+(exActiveTab==='class'?'active':'')+'">クラス展示</button>'
      +   '<button data-sub="club" class="'+(exActiveTab==='club'?'active':'')+'">部活・有志展示</button>'
      + '</div>'
      + '<div class="subpage '+(exActiveTab==='class'?'active':'')+'" id="ex-class"><div class="card-grid">'+classHtml+'</div></div>'
      + '<div class="subpage '+(exActiveTab==='club'?'active':'')+'" id="ex-club"><div class="card-grid">'+clubHtml+'</div></div>';
    document.getElementById('exhibits-content').innerHTML = html;
  }

  function renderTimetable(){
    var tt = state.timetable;
    if(ttActiveDay >= tt.days.length) ttActiveDay = 0;
    var dayTabsHtml = tt.days.map(function(d,i){
      return '<button class="day-btn '+(i===ttActiveDay?'active':'')+'" data-action="setDay" data-index="'+i+'">'+esc(d.label || ('Day '+(i+1)))+'</button>';
    }).join('');
    if(editMode){ dayTabsHtml += '<button class="ed-add" data-action="addTtDay">＋ 日を追加</button>'; }

    var day = tt.days[ttActiveDay] || {label:'',rows:[]};
    var bodyHtml;
    if(editMode){
      var rowsHtml = day.rows.map(function(r,i){
        return '<div class="ed-row">'
          + '<input class="ed-input" style="max-width:90px;" data-path="timetable.days.'+ttActiveDay+'.rows.'+i+'.time" value="'+esc(r.time)+'" placeholder="時間">'
          + '<input class="ed-input" data-path="timetable.days.'+ttActiveDay+'.rows.'+i+'.event" value="'+esc(r.event)+'" placeholder="内容">'
          + '<input class="ed-input" style="max-width:140px;" data-path="timetable.days.'+ttActiveDay+'.rows.'+i+'.place" value="'+esc(r.place)+'" placeholder="場所">'
          + '<button class="ed-remove" data-action="removeTtRow" data-day="'+ttActiveDay+'" data-index="'+i+'">×</button>'
          + '</div>';
      }).join('');
      bodyHtml = '<div class="ed-day-label">日タブの表示名：<input class="ed-input" data-path="timetable.days.'+ttActiveDay+'.label" value="'+esc(day.label)+'" style="margin-top:6px;"></div>'
        + rowsHtml
        + '<button class="ed-add" data-action="addTtRow" data-day="'+ttActiveDay+'">＋ 行を追加</button>'
        + (tt.days.length > 1 ? '<button class="ed-add" data-action="removeTtDay" data-index="'+ttActiveDay+'" style="color:var(--pink);margin-left:8px;">この日を削除</button>' : '');
    } else {
      bodyHtml = '<table class="tt"><tr><th>時間</th><th>内容</th><th>場所</th></tr>'
        + day.rows.map(function(r){ return '<tr><td class="time">'+esc(r.time)+'</td><td>'+esc(r.event)+'</td><td>'+esc(r.place)+'</td></tr>'; }).join('')
        + '</table>';
    }

    var html = ''
      + '<div class="eyebrow-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>タイムテーブル</div>'
      + '<h2 class="section-title">タイムスケジュール</h2>'
      + '<p class="section-lede">全体のタイムテーブル画像と、日ごとのスケジュール表を掲載しています。</p>'
      + (editMode ? '<div class="edit-note">✏️ 編集モード：日を切り替えながら行を追加・編集できます</div>' : '')
      + '<div class="tt-image">' + imgSlotHtml('timetable.imageSrc', tt.imageSrc, 'タイムテーブル画像未設定') + '</div>'
      + '<div class="day-tabs">' + dayTabsHtml + '</div>'
      + '<div>' + bodyHtml + '</div>';
    document.getElementById('timetable-content').innerHTML = html;
  }

  function renderRoute(){
    var r = state.route;
    function listHtml(items, key, addAction, removeAction, placeLabel, minsLabel){
      if(editMode){
        var rows = items.map(function(it,i){
          return '<div class="ed-row">'
            + '<input class="ed-input" data-path="route.'+key+'.'+i+'.place" value="'+esc(it.place)+'" placeholder="'+placeLabel+'">'
            + '<input class="ed-input" style="max-width:120px;" data-path="route.'+key+'.'+i+'.mins" value="'+esc(it.mins)+'" placeholder="'+minsLabel+'">'
            + '<button class="ed-remove" data-action="'+removeAction+'" data-index="'+i+'">×</button>'
            + '</div>';
        }).join('');
        return rows + '<button class="ed-add" data-action="'+addAction+'">＋ 追加</button>';
      }
      return '<ul class="access-list">' + items.map(function(it){
        return '<li><span class="place">'+esc(it.place)+'</span><span class="mins">'+esc(it.mins)+'</span></li>';
      }).join('') + '</ul>';
    }
    var noteHtml = editMode
      ? '<textarea class="ed-input" data-path="route.note">'+esc(r.note)+'</textarea>'
      : '<div class="note-box">'+esc(r.note)+'</div>';

    var html = ''
      + '<div class="eyebrow-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 21s7-7.5 7-12a7 7 0 1 0-14 0c0 4.5 7 12 7 12z"/><circle cx="12" cy="9" r="2.4"/></svg>ルート案内</div>'
      + '<h2 class="section-title">校内マップ・アクセス</h2>'
      + '<p class="section-lede">学校までのアクセス方法と、校内マップを掲載しています。</p>'
      + (editMode ? '<div class="edit-note">✏️ 編集モード：地図画像や行き方を書き換えられます</div>' : '')
      + '<div class="route-grid">'
      +   '<div>' + imgSlotHtml('route.mapSrc', r.mapSrc, '校内マップ画像未設定', 'map-slot') + '</div>'
      +   '<div class="access-card">'
      +     '<h3><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="6" width="18" height="12" rx="2"/><circle cx="7.5" cy="16.5" r="1"/><circle cx="16.5" cy="16.5" r="1"/></svg>バスでお越しの方</h3>'
      +     listHtml(r.bus, 'bus', 'addBus', 'removeBus', '駅・乗り場', '所要時間')
      +     '<h3 style="margin-top:18px;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="5" r="2"/><path d="M12 7v6l-3 8M12 13l3 8M9 11l-4 2M15 11l4 2"/></svg>徒歩でお越しの方</h3>'
      +     listHtml(r.walk, 'walk', 'addWalk', 'removeWalk', '駅名', '所要時間')
      +     '<div style="margin-top:14px;">' + noteHtml + '</div>'
      +   '</div>'
      + '</div>';
    document.getElementById('route-content').innerHTML = html;
  }

  function renderNews(){
    var itemsHtml = state.news.map(function(n,i){
      if(editMode){
        return '<div class="news-item">'
          + '<button class="ed-remove" data-action="removeNews" data-index="'+i+'" style="position:absolute;right:0;top:16px;">×</button>'
          + '<input class="ed-input" style="max-width:110px;" data-path="news.'+i+'.date" value="'+esc(n.date)+'" placeholder="日付">'
          + '<div style="flex:1;">'
          +   '<input class="ed-input" data-path="news.'+i+'.title" value="'+esc(n.title)+'" placeholder="タイトル">'
          +   '<textarea class="ed-input" data-path="news.'+i+'.desc" placeholder="内容">'+esc(n.desc)+'</textarea>'
          + '</div>'
          + '</div>';
      }
      var badge = n.badge === 'new' ? '<span class="badge new">NEW</span>' : (n.badge === 'update' ? '<span class="badge update">更新</span>' : '');
      return '<div class="news-item"><div class="nd">'+esc(n.date)+'</div><div class="nb"><h3>'+esc(n.title)+badge+'</h3><p>'+esc(n.desc)+'</p></div></div>';
    }).join('');
    var html = ''
      + '<div class="eyebrow-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 4h16v13H8l-4 4V4z"/></svg>お知らせ</div>'
      + '<h2 class="section-title">最新情報</h2>'
      + '<p class="section-lede">来場に関する情報や変更点を随時更新します。</p>'
      + (editMode ? '<div class="edit-note">✏️ 編集モード：お知らせを追加・編集できます</div>' : '')
      + '<div class="news-list">' + itemsHtml + '</div>'
      + (editMode ? '<button class="ed-add" data-action="addNews">＋ お知らせを追加</button>' : '');
    document.getElementById('news-content').innerHTML = html;
  }

  function renderContent(){
    renderHome();
    renderExhibits();
    renderTimetable();
    renderRoute();
    renderNews();
  }

  function setPath(obj, path, value){
    var parts = path.split('.');
    var cur = obj;
    for(var i=0;i<parts.length-1;i++){
      var key = parts[i];
      if(/^\d+$/.test(key)) key = parseInt(key,10);
      cur = cur[key];
    }
    var last = parts[parts.length-1];
    if(/^\d+$/.test(last)) last = parseInt(last,10);
    cur[last] = value;
  }

  function showToast(msg){
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(t._timer);
    t._timer = setTimeout(function(){ t.classList.remove('show'); }, 2600);
  }

  function compressImage(file, maxW, quality, cb){
    var reader = new FileReader();
    reader.onload = function(e){
      var img = new Image();
      img.onload = function(){
        var w = img.width, h = img.height;
        if(w > maxW){ h = Math.round(h * maxW / w); w = maxW; }
        var canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        var ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        cb(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = function(){ showToast('画像を読み込めませんでした'); };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  function triggerImageUpload(path){
    var inp = document.createElement('input');
    inp.type = 'file';
    inp.accept = 'image/*';
    inp.onchange = function(){
      var file = inp.files && inp.files[0];
      if(!file) return;
      compressImage(file, 1400, 0.85, function(dataUrl){
        setPath(state, path, dataUrl);
        renderContent();
      });
    };
    inp.click();
  }

  function updateFab(){
    var btnEdit = document.getElementById('btnEdit');
    var btnSave = document.getElementById('btnSave');
    var btnCancel = document.getElementById('btnCancel');
    if(editMode){
      btnEdit.classList.add('hidden');
      btnSave.classList.remove('hidden');
      btnCancel.classList.remove('hidden');
    } else {
      btnSave.classList.add('hidden');
      btnCancel.classList.add('hidden');
      if(artifactApi){ btnEdit.classList.remove('hidden'); }
      else { btnEdit.classList.add('hidden'); }
    }
  }

  function buildPublishHtml(){
    var json = JSON.stringify(state).replace(/<\/script/gi, '<\\/script');
    var re = /(<script type="application\/json" id="site-data">)[\s\S]*?(<\/script>)/;
    return ORIGINAL_HTML.replace(re, '$1' + json + '$2');
  }

  document.addEventListener('input', function(e){
    if(e.target.matches('.ed-input[data-path]')){
      setPath(state, e.target.getAttribute('data-path'), e.target.value);
    }
  });

  document.addEventListener('click', function(e){
    var mainTabBtn = e.target.closest('#mainTabs button');
    if(mainTabBtn){
      document.querySelectorAll('#mainTabs button').forEach(function(b){ b.classList.remove('active'); });
      document.querySelectorAll('.page').forEach(function(p){ p.classList.remove('active'); });
      mainTabBtn.classList.add('active');
      document.getElementById('page-' + mainTabBtn.dataset.page).classList.add('active');
      window.scrollTo({top:0, behavior:'smooth'});
      return;
    }
    var exTabBtn = e.target.closest('#exTabs button');
    if(exTabBtn){
      exActiveTab = exTabBtn.getAttribute('data-sub');
      renderExhibits();
      return;
    }

    var btn = e.target.closest('[data-action]');
    if(!btn) return;
    var action = btn.getAttribute('data-action');
    var idx = parseInt(btn.getAttribute('data-index'), 10);

    if(action === 'addDate'){ state.home.dates.push({day:'',date:'',time:''}); renderHome(); }
    else if(action === 'removeDate'){ state.home.dates.splice(idx,1); renderHome(); }
    else if(action === 'addExhibit'){ state.exhibits[btn.getAttribute('data-list')].push(blankExhibit()); renderExhibits(); }
    else if(action === 'removeExhibit'){ state.exhibits[btn.getAttribute('data-list')].splice(idx,1); renderExhibits(); }
    else if(action === 'setDay'){ ttActiveDay = idx; renderTimetable(); }
    else if(action === 'addTtDay'){ state.timetable.days.push({label:'新しい日', rows:[]}); ttActiveDay = state.timetable.days.length - 1; renderTimetable(); }
    else if(action === 'removeTtDay'){ state.timetable.days.splice(idx,1); ttActiveDay = 0; renderTimetable(); }
    else if(action === 'addTtRow'){ var dIdx = parseInt(btn.getAttribute('data-day'),10); state.timetable.days[dIdx].rows.push(blankRow()); renderTimetable(); }
    else if(action === 'removeTtRow'){ var dIdx2 = parseInt(btn.getAttribute('data-day'),10); state.timetable.days[dIdx2].rows.splice(idx,1); renderTimetable(); }
    else if(action === 'addBus'){ state.route.bus.push(blankAccess()); renderRoute(); }
    else if(action === 'removeBus'){ state.route.bus.splice(idx,1); renderRoute(); }
    else if(action === 'addWalk'){ state.route.walk.push(blankAccess()); renderRoute(); }
    else if(action === 'removeWalk'){ state.route.walk.splice(idx,1); renderRoute(); }
    else if(action === 'addNews'){ state.news.unshift(blankNews()); renderNews(); }
    else if(action === 'removeNews'){ state.news.splice(idx,1); renderNews(); }
    else if(action === 'uploadImg'){ triggerImageUpload(btn.getAttribute('data-path')); }
  });

  document.getElementById('btnEdit').addEventListener('click', function(){
    editMode = true;
    snapshot = JSON.parse(JSON.stringify(state));
    renderContent();
    updateFab();
  });
  document.getElementById('btnCancel').addEventListener('click', function(){
    state = snapshot;
    editMode = false;
    renderContent();
    updateFab();
  });
  document.getElementById('btnSave').addEventListener('click', function(){
    if(!artifactApi){ showToast('この端末では保存できません'); return; }
    var html = buildPublishHtml();
    var btnSave = document.getElementById('btnSave');
    btnSave.disabled = true;
    btnSave.textContent = '保存中…';
    artifactApi.publish(html).then(function(){
      editMode = false;
      snapshot = null;
      renderContent();
      updateFab();
      showToast('保存して公開しました');
    }).catch(function(err){
      if(err && err.code === 'conflict'){
        showToast('他の人が先に保存しました。ページを更新します');
        setTimeout(function(){ location.reload(); }, 1200);
      } else if(err && (err.code === 'not_granted' || err.code === 'not_writer')){
        showToast('この端末では編集を保存できません');
      } else {
        showToast('保存に失敗しました。もう一度お試しください');
      }
    }).finally(function(){
      btnSave.disabled = false;
      btnSave.textContent = '💾 保存して公開';
    });
  });

  renderContent();
  updateFab();

  (function initCapability(){
    try{
      if(window.claude && typeof window.claude.use === 'function'){
        window.claude.use('artifact').then(function(api){
          artifactApi = api;
          updateFab();
        }).catch(function(){ artifactApi = null; updateFab(); });
      }
    }catch(e){ artifactApi = null; }
  })();
})();
</script>
